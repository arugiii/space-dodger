<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Dodger</title>
<style>
  :root {
    --bg: #05060f;
    --accent: #4df0ff;
    --accent2: #ff5d8f;
    --text: #e8f6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #10142b 0%, var(--bg) 70%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  h1 {
    margin: 8px 0;
    letter-spacing: 4px;
    font-size: 1.6rem;
    text-shadow: 0 0 12px var(--accent);
  }
  #hud {
    display: flex;
    gap: 24px;
    margin-bottom: 8px;
    font-size: 1rem;
    color: var(--accent);
  }
  canvas {
    background: #0b0e1f;
    border: 2px solid var(--accent);
    box-shadow: 0 0 24px rgba(77, 240, 255, 0.35);
    border-radius: 8px;
    touch-action: none;
    max-width: 95vw;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 15, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  button {
    background: var(--accent);
    color: #04121a;
    border: none;
    padding: 10px 24px;
    font-weight: bold;
    font-size: 1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:hover { transform: scale(1.05); }
  #controls-note {
    margin-top: 10px;
    font-size: 0.85rem;
    color: #9fb4c7;
  }
  #best {
    color: var(--accent2);
  }
</style>
</head>
<body>
  <h1>🚀 SPACE DODGER</h1>
  <div id="hud">
    <div>Skor: <span id="score">0</span></div>
    <div id="best">Best: <span id="bestScore">0</span></div>
  </div>
  <canvas id="game" width="420" height="560"></canvas>
  <p id="controls-note">Panah kiri/kanan atau A/D untuk gerak · Tahan spasi buat boost. Di HP, geser layar.</p>

  <div id="overlay">
    <h2 id="overlayTitle">Space Dodger</h2>
    <p id="overlayText">Hindari asteroid selama mungkin. Makin lama, makin cepat!</p>
    <button id="startBtn">Mulai Main</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestScoreEl = document.getElementById('bestScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const W = canvas.width, H = canvas.height;
  const STORAGE_KEY = 'space-dodger-best';

  let best = Number(localStorage.getItem(STORAGE_KEY) || 0);
  bestScoreEl.textContent = best;

  let ship, asteroids, keys, score, speed, spawnTimer, running, animId;

  function resetGame() {
    ship = { x: W / 2 - 16, y: H - 60, w: 32, h: 32, speed: 5 };
    asteroids = [];
    keys = {};
    score = 0;
    speed = 2.2;
    spawnTimer = 0;
    running = true;
    scoreEl.textContent = '0';
  }

  function spawnAsteroid() {
    const size = 18 + Math.random() * 26;
    asteroids.push({
      x: Math.random() * (W - size),
      y: -size,
      size,
      vy: speed + Math.random() * 1.5,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.1
    });
  }

  function drawShip() {
    ctx.save();
    ctx.translate(ship.x + ship.w / 2, ship.y + ship.h / 2);
    ctx.fillStyle = '#4df0ff';
    ctx.shadowColor = '#4df0ff';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(0, -16);
    ctx.lineTo(14, 16);
    ctx.lineTo(0, 8);
    ctx.lineTo(-14, 16);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x + a.size / 2, a.y + a.size / 2);
    ctx.rotate(a.rot);
    ctx.fillStyle = '#ff5d8f';
    ctx.shadowColor = '#ff5d8f';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    const spikes = 7;
    for (let i = 0; i < spikes; i++) {
      const angle = (i / spikes) * Math.PI * 2;
      const r = a.size / 2 * (0.75 + Math.random() * 0.08);
      const px = Math.cos(angle) * r;
      const py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawStars() {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 53 + (score * 0.5) % W) % W;
      const sy = (i * 97) % H;
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    if (!running) return;

    if (keys['ArrowLeft'] || keys['a']) ship.x -= ship.speed;
    if (keys['ArrowRight'] || keys['d']) ship.x += ship.speed;
    ship.x = Math.max(0, Math.min(W - ship.w, ship.x));

    spawnTimer++;
    const spawnRate = Math.max(18, 46 - Math.floor(score / 5));
    if (spawnTimer > spawnRate) {
      spawnAsteroid();
      spawnTimer = 0;
    }

    speed += 0.0016;

    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.y += a.vy;
      a.rot += a.vr;
      const hitbox = { x: a.x + a.size * 0.2, y: a.y + a.size * 0.2, w: a.size * 0.6, h: a.size * 0.6 };
      if (rectsOverlap(ship, hitbox)) {
        return gameOver();
      }
      if (a.y > H) {
        asteroids.splice(i, 1);
        score++;
        scoreEl.textContent = score;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    asteroids.forEach(drawAsteroid);
    drawShip();
  }

  function loop() {
    update();
    draw();
    if (running) animId = requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(animId);
    if (score > best) {
      best = score;
      localStorage.setItem(STORAGE_KEY, String(best));
      bestScoreEl.textContent = best;
    }
    overlayTitle.textContent = 'Game Over 💥';
    overlayText.textContent = `Skor kamu: ${score} — Best: ${best}`;
    startBtn.textContent = 'Main Lagi';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    overlay.classList.add('hidden');
    resetGame();
    loop();
  }

  window.addEventListener('keydown', (e) => { keys[e.key] = true; });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  // Kontrol sentuh sederhana untuk mobile
  let touchX = null;
  canvas.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; });
  canvas.addEventListener('touchmove', (e) => {
    if (touchX === null || !running) return;
    const dx = e.touches[0].clientX - touchX;
    ship.x += dx * 0.6;
    ship.x = Math.max(0, Math.min(W - ship.w, ship.x));
    touchX = e.touches[0].clientX;
  }, { passive: true });

  startBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
